name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install ffmpeg
        # apt 源偶发极慢（实测一次 39 分钟烧穿 40 分钟任务预算被强杀）：步骤级超时 + 重试兜底
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ffmpeg; then
              ffmpeg -version | head -1
              exit 0
            fi
            echo "apt 安装第 $i 次失败，10 秒后重试"
            sleep 10
          done
          exit 1
      - run: npm ci
      # 类型检查 + SQL 列名 + DDL 校验 + 协议 / 清洗 / 回归单测
      - run: npm run check
      # 隔离实例（临时 SQLite + 独立队列前缀 + 第三方 mock）上跑全部四套冒烟
      - run: npm run smoke:all
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ESLint + Prettier 格式检查（P3-1）
      - run: npm run lint
      - run: npm run build

  # 浏览器端到端：隔离后端（临时 SQLite + 内存队列 + 第三方 mock）+ Vite + Playwright Chromium，
  # 跑人物库（32 项）与主链路 选题→文案→审核→视频→剪辑→复审→发布→任务中心（28 项）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - name: Install ffmpeg
        # 同 server 任务：apt 源偶发极慢，步骤级超时 + 重试兜底
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ffmpeg; then
              ffmpeg -version | head -1
              exit 0
            fi
            echo "apt 安装第 $i 次失败，10 秒后重试"
            sleep 10
          done
          exit 1
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_ARTIFACTS: e2e-artifacts
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e-artifacts
          if-no-files-found: ignore
